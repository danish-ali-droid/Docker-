<!DOCTYPE html>
<html>
<head>
    <title>Three-Tier App</title>
    <style>
        body { font-family: Arial; margin: 2rem; }
        .container { max-width: 600px; margin: auto; }
        input, button { padding: 0.5rem; margin: 0.5rem 0; }
        ul { list-style-type: none; padding: 0; }
        li { background: #f4f4f4; margin: 0.5rem 0; padding: 0.5rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Three-Tier App with PostgreSQL & Redis</h1>
    <p>Total visits (cached in Redis): <strong id="visits">Loading...</strong></p>
    <hr>
    <h2>Items</h2>
    <ul id="itemsList"></ul>
    <input type="text" id="itemName" placeholder="New item name">
    <button onclick="addItem()">Add Item</button>
    <p><small>Data from PostgreSQL; cached in Redis for 60 seconds.</small></p>
</div>

<script>
    const API_BASE = '/api';  // will be proxied via reverse proxy

    async function loadVisits() {
        const res = await fetch(`${API_BASE}/visits`);
        const data = await res.json();
        document.getElementById('visits').innerText = data.total;
    }

    async function loadItems() {
        const res = await fetch(`${API_BASE}/items`);
        const data = await res.json();
        const itemsList = document.getElementById('itemsList');
        itemsList.innerHTML = '';
        data.data.forEach(item => {
            const li = document.createElement('li');
            li.textContent = `${item.name} (ID: ${item.id})`;
            itemsList.appendChild(li);
        });
        // Show cache/database source
        const sourceMsg = document.createElement('small');
        sourceMsg.textContent = `Source: ${data.source}`;
        itemsList.appendChild(sourceMsg);
    }

    async function addItem() {
        const name = document.getElementById('itemName').value;
        if (!name) return;
        const res = await fetch(`${API_BASE}/items`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name })
        });
        if (res.ok) {
            document.getElementById('itemName').value = '';
            loadItems();  // refresh list (cache will be invalidated)
        } else {
            alert('Failed to add item');
        }
    }

  //  loadVisits();
   // loadItems();
  
    //etInterval(loadVisits, 5000); // update visits every 5 seconds
    async function registerVisit() {
        try {
            await fetch(`${API_BASE}/visit`, { method: 'POST' });
        } catch (err) {
            console.error("cannot count visit", err);
        }
    }
    async function init() {
        await registerVisit();
        await loadVisits();   
        await loadItems();    
    }

   init();
</script>
</body>
</html>
